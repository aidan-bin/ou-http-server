name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        preset: [default, no-https, asan, tsan]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libboost-test-dev libssl-dev
      - run: cmake --workflow --preset ${{ matrix.preset }}

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libboost-test-dev libssl-dev clang-format-19 clang-tidy-19
      - run: clang-format-19 --dry-run -Werror src/*.h src/*.cpp tests/test_http.cpp
      - run: |
          cmake --preset default -DCLANG_TIDY_EXECUTABLE=$(which clang-tidy-19)
          cmake --build --preset tidy
