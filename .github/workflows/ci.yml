name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        preset: [default, asan, tsan]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libboost-test-dev libssl-dev
      - run: cmake --workflow --preset ${{ matrix.preset }}

  fuzz:
    runs-on: ubuntu-24.04
    env:
      CXX: clang++-19
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libboost-test-dev libssl-dev clang-19 libclang-rt-19-dev
      - run: cmake --workflow --preset fuzz
      - run: |
          mkdir corpus
          build/fuzz-Linux/fuzz/fuzz_request_reader -max_total_time=60 -timeout=5 -max_len=1025 -dict=fuzz/http.dict \
            corpus fuzz/corpus/request_reader
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: |
            crash-*
            leak-*
            timeout-*
            oom-*

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libboost-test-dev libssl-dev clang-format-19 clang-tidy-19
      - run: clang-format-19 --dry-run -Werror src/*.h src/*.cpp tests/*.h tests/*.cpp fuzz/*.cpp
      - run: |
          cmake --preset default -DCLANG_TIDY_EXECUTABLE=$(which clang-tidy-19)
          cmake --build --preset tidy
